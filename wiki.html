<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki — История одного штурма</title>
    <style>
        /* === ОБЩИЙ СТИЛЬ === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: #0a0a0a;
            font-family: 'Courier New', 'Lucida Console', monospace;
            color: #dddddd;
            overflow: hidden;
        }

        /* === КОНТЕЙНЕР С КОЛОНКАМИ === */
        .wiki-container {
            display: flex;
            height: 100vh;
            width: 100%;
            padding: 40px;
            gap: 40px;
            background: #0a0a0a;
        }

        /* === ЛЕВАЯ КОЛОНКА (САЙДБАР) === */
        .wiki-sidebar {
            flex: 0 0 280px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-top: 20px;
            border-right: 2px solid rgba(255, 255, 255, 0.15);
            padding-right: 30px;
            overflow-y: auto;
        }

        .wiki-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .wiki-sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }

        .wiki-sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .wiki-sidebar .nav-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 3px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 8px;
        }

        .wiki-sidebar .nav-title .highlight {
            color: #ff0000;
        }

        /* === КНОПКИ В САЙДБАРЕ (БЕЗ СМАЙЛИКОВ) === */
        .wiki-sidebar .nav-btn {
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-size: 1.1rem;
            color: #bbbbbb;
            text-decoration: none;
            padding: 10px 16px;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wiki-sidebar .nav-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            border-left-color: #ff0000;
            transform: translateX(4px);
        }

        .wiki-sidebar .nav-btn.active {
            color: #ffffff;
            background: rgba(255, 0, 0, 0.08);
            border-left-color: #ff0000;
        }

        /* === КНОПКА НАЗАД НА ГЛАВНУЮ === */
        .wiki-sidebar .back-btn {
            margin-top: auto;
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-size: 0.95rem;
            color: #666666;
            text-decoration: none;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 20px;
        }

        .wiki-sidebar .back-btn:hover {
            color: #ffffff;
        }

        /* === ПРАВАЯ КОЛОНКА (КОНТЕНТ) === */
        .wiki-content {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding: 20px 10px 20px 30px;
            display: flex;
            flex-direction: column;
        }

        .wiki-content::-webkit-scrollbar {
            width: 4px;
        }

        .wiki-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }

        .wiki-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .wiki-content .content-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wiki-content .content-title .highlight {
            color: #ff0000;
        }

        .wiki-content .content-text {
            font-size: 1rem;
            line-height: 1.7;
            color: #cccccc;
            letter-spacing: 0.3px;
            white-space: pre-wrap;
        }

        .wiki-content .content-text strong {
            color: #ffffff;
        }

        .wiki-content .content-text .highlight {
            color: #ff0000;
        }

        /* === ПЕРСОНАЛЬНЫЙ БЛОК (ЗАГОЛОВКИ) === */
        .wiki-content .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            margin-top: 28px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .wiki-content .section-title .highlight {
            color: #ff0000;
        }

        /* === АДАПТАЦИЯ === */
        @media (max-width: 850px) {
            .wiki-container {
                flex-direction: column;
                padding: 20px;
                gap: 20px;
                height: 100vh;
                overflow: hidden;
            }

            .wiki-sidebar {
                flex: 0 0 auto;
                flex-direction: row;
                flex-wrap: wrap;
                border-right: none;
                border-bottom: 2px solid rgba(255, 255, 255, 0.15);
                padding-right: 0;
                padding-bottom: 16px;
                gap: 10px 16px;
                max-height: 180px;
                overflow-y: auto;
            }

            .wiki-sidebar .nav-title {
                width: 100%;
                font-size: 1.4rem;
                border-bottom: none;
                margin-bottom: 4px;
            }

            .wiki-sidebar .nav-btn {
                font-size: 0.95rem;
                padding: 6px 14px;
                border-left: none;
                border-bottom: 2px solid transparent;
                border-radius: 0;
            }

            .wiki-sidebar .nav-btn:hover {
                transform: none;
                border-left-color: transparent;
                border-bottom-color: #ff0000;
            }

            .wiki-sidebar .nav-btn.active {
                border-left-color: transparent;
                border-bottom-color: #ff0000;
            }

            .wiki-sidebar .back-btn {
                margin-top: 0;
                border-top: none;
                padding-top: 0;
                padding: 6px 14px;
                font-size: 0.9rem;
            }

            .wiki-content {
                padding: 10px 0 10px 0;
                height: 100%;
                overflow-y: auto;
            }

            .wiki-content .content-title {
                font-size: 1.6rem;
            }

            .wiki-content .content-text {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 500px) {
            .wiki-container {
                padding: 16px;
            }
            .wiki-sidebar .nav-title {
                font-size: 1.2rem;
            }
            .wiki-sidebar .nav-btn {
                font-size: 0.8rem;
                padding: 4px 10px;
            }
            .wiki-content .content-title {
                font-size: 1.3rem;
            }
            .wiki-content .content-text {
                font-size: 0.8rem;
            }
            .wiki-content .section-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="wiki-container">

        <!-- ====== ЛЕВАЯ КОЛОНКА (САЙДБАР) ====== -->
        <div class="wiki-sidebar">
            <div class="nav-title">Вики<span class="highlight">.</span></div>

            <!-- КНОПКИ РАЗДЕЛОВ (БЕЗ СМАЙЛИКОВ) -->
            <a href="#" class="nav-btn" data-section="cherep">ЧВК Череп</a>
            <a href="#" class="nav-btn" data-section="krasnorus">Армия Красноруси</a>

            <!-- КНОПКА НАЗАД -->
            <a href="index.html" class="back-btn">← На главную</a>
        </div>

        <!-- ====== ПРАВАЯ КОЛОНКА (КОНТЕНТ) ====== -->
        <div class="wiki-content" id="wikiContent">
            <!-- ЗАГОЛОВОК -->
            <div class="content-title">Добро пожаловать в <span class="highlight">Вики</span></div>

            <!-- ТЕКСТ (будет заменяться через JS) -->
            <div class="content-text" id="wikiText">
                Выберите раздел слева, чтобы узнать больше о мире <strong>Истории одного <span class="highlight">штурма</span></strong>.
            </div>
        </div>

    </div>

    <script>
        // =========================================
        //  ДАННЫЕ ДЛЯ РАЗДЕЛОВ (ОБНОВЛЁННЫЙ ТЕКСТ)
        // =========================================
        const wikiData = {
            cherep: {
                title: 'ЧВК "Череп"',
                text: `Частная военная компания, основанная 17 мая 2023 года как небольшой отряд спецназа под руководством ФСБ России. Структура была создана для защиты южных регионов страны от атак боевиков, которые нападали с территорий стран Кавказа.

        После данной операции часть оперативников были завербованы Кьюменией для ликвидации главарей оппозиции. Как раз именно с этого момента появилось название ЧВК "Череп".

        В конце мая 2024 года на востоке Красноруси, при поддержке властей РФ, вспыхнуло восстание пророссийских сил. 7 июня 2024 года подразделения ЧВК "Череп" пересекли границу Красноруси со стороны Кьюмении и Беларуси.`
            },
            krasnorus: {
                title: 'Армия Красноруси',
                text: `Армия Красноруси или, как официально, Вооруженные силы Красноруси — это официальное воинское образование государства Краснорусь, которое было сформировано в 1991 году после развала СССР.

        До 2014 года Краснорусь была нейтральна к России, однако после из-за агрессии России на Наварию страна встала на путь сближения с Европой.

        С 2020 по 2024 год в страну в рамках сотрудничества с НАТО доставлялось вооружение, техника и инструктора альянса.`
            }
        };

        // =========================================
        //  УПРАВЛЕНИЕ АКТИВНЫМИ КНОПКАМИ И КОНТЕНТОМ
        // =========================================
        const navBtns = document.querySelectorAll('.nav-btn[data-section]');
        const contentTitle = document.querySelector('.content-title');
        const contentText = document.getElementById('wikiText');

        // Функция для обновления контента
        function loadSection(sectionKey) {
            if (!sectionKey || !wikiData[sectionKey]) return;

            const data = wikiData[sectionKey];
            contentTitle.innerHTML = `<span class="highlight">${data.title}</span>`;
            contentText.innerHTML = data.text;

            // Обновляем активный класс на кнопках
            navBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.section === sectionKey) {
                    btn.classList.add('active');
                }
            });
        }

        // Назначаем обработчики кликов на кнопки
        navBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const section = this.dataset.section;
                loadSection(section);
            });
        });

        // === ЗАГРУЖАЕМ РАЗДЕЛ "ЧВК Череп" ПО УМОЛЧАНИЮ ===
        loadSection('cherep');
    </script>

</body>
</html>
